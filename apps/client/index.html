<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friday Night Dynasty</title>
<style>
  :root {
    --bg: #0e1020; --panel: #171a33; --panel-2: #20244a; --line: #343a6e;
    --ink: #f3f1e7; --dim: #a9adc9; --accent: #f2c14e; --red: #d8262c; --good: #58c26a;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--mono); }
  body { min-height: 100vh; display: flex; justify-content: center; }
  #app { width: 100%; max-width: 980px; padding: 10px; }
  .hidden { display: none !important; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* title */
  #title { position: relative; cursor: pointer; border: 3px solid var(--line); border-radius: 6px; overflow: hidden; background: #000; padding: 0; width: 100%; display: block; }
  #title img { display: block; width: 100%; height: auto; image-rendering: auto; }
  #title .hint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 12px; letter-spacing: 2px; color: var(--ink); text-shadow: 0 2px 0 #000; animation: blink 1.2s steps(2) infinite; }
  #title .ver { position: absolute; left: 8px; bottom: 8px; font-size: 10px; color: var(--ink); background: rgba(8, 9, 20, 0.7); padding: 2px 6px; border-radius: 3px; }
  #setupLogo { display: block; width: min(360px, 70%); height: auto; margin: 10px auto 0; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #title .hint { animation: none; } }

  /* setup */
  #setup h2, #final h2 { font-size: 18px; letter-spacing: 3px; text-transform: uppercase; margin: 18px 0 6px; text-align: center; }
  #setup p { text-align: center; color: var(--dim); font-size: 13px; margin: 0 0 16px; }
  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .team-card { background: var(--panel); border: 3px solid var(--line); border-radius: 6px; padding: 16px 12px; text-align: center; }
  .team-card:hover { border-color: var(--accent); }
  .team-card .swatch { height: 34px; border-radius: 3px; margin-bottom: 10px; border: 2px solid #000; }
  .team-card .nm { font-size: 17px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .team-card .sub { font-size: 12px; color: var(--dim); margin-top: 4px; }
  .note { color: var(--dim); font-size: 11px; text-align: center; margin-top: 14px; }

  /* score bug */
  #bug { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .side { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 2px solid var(--line); border-radius: 4px; padding: 6px 10px; min-width: 0; }
  .side.r { flex-direction: row-reverse; text-align: right; }
  .side .chip { width: 10px; align-self: stretch; border-radius: 2px; flex: none; }
  .side .ab { font-weight: 700; letter-spacing: 2px; font-size: 16px; }
  .side .to { font-size: 9px; color: var(--accent); letter-spacing: 2px; }
  .side .sc { font-size: 26px; font-weight: 700; margin-left: auto; }
  .side.r .sc { margin-left: 0; margin-right: auto; }
  .side.poss { border-color: var(--accent); }
  .side.poss .ab::after { content: " \25CF"; color: var(--accent); font-size: 10px; vertical-align: middle; }
  #mid { background: #000; border: 2px solid var(--line); border-radius: 4px; padding: 5px 12px; text-align: center; min-width: 150px; }
  #mid .clk { font-size: 17px; font-weight: 700; }
  #mid .dd { font-size: 12px; color: var(--accent); margin-top: 2px; white-space: nowrap; }

  /* stage */
  #stage { position: relative; border: 3px solid var(--line); border-radius: 6px; overflow: hidden; background: #000; aspect-ratio: 16 / 9; }
  #phaser, #phaser canvas { width: 100% !important; height: 100% !important; display: block; image-rendering: pixelated; }
  #banner { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); max-width: 92%; background: rgba(8, 9, 20, 0.9); border: 2px solid var(--accent); border-radius: 4px; padding: 8px 14px; font-size: 14px; text-align: center; line-height: 1.35; }
  #banner.big { border-color: var(--red); font-size: 16px; font-weight: 700; }
  #banner small { display: block; color: var(--dim); font-size: 11px; margin-top: 3px; font-weight: 400; }
  #tag { position: absolute; left: 8px; top: 8px; background: var(--red); color: #fff; font-size: 11px; letter-spacing: 2px; padding: 3px 8px; border-radius: 3px; }
  #calls { position: absolute; right: 8px; top: 8px; background: rgba(8, 9, 20, 0.8); font-size: 11px; padding: 4px 8px; border-radius: 3px; color: var(--dim); text-align: right; line-height: 1.4; }
  #calls b { color: var(--ink); font-weight: 600; }

  /* controls */
  #bar { display: flex; align-items: center; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
  #bar .lbl { font-size: 11px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; margin-right: 2px; }
  .seg { background: var(--panel); border: 2px solid var(--line); border-radius: 4px; padding: 5px 10px; font-size: 12px; }
  .seg.on { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
  #prompt { margin-left: auto; font-size: 12px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }

  #panel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  @media (max-width: 640px) { #panel { grid-template-columns: repeat(2, 1fr); } #mid { min-width: 110px; } .side .sc { font-size: 20px; } }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 5px; padding: 6px 6px 8px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .card:hover { border-color: var(--accent); background: var(--panel-2); }
  .card svg { width: 100%; height: auto; background: #1c6b2c; border-radius: 3px; display: block; }
  .card .nm { font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; gap: 4px; align-items: baseline; }
  .card .kind { font-size: 9px; letter-spacing: 1px; padding: 1px 4px; border-radius: 2px; background: #000; color: var(--accent); text-transform: uppercase; }
  .card .ds { font-size: 10.5px; color: var(--dim); line-height: 1.3; }
  .card kbd { font-family: inherit; font-size: 10px; color: var(--dim); }
  .wide { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
  .act { flex: 1; background: var(--panel); border: 2px solid var(--line); border-radius: 5px; padding: 9px 8px; font-size: 13px; font-weight: 700; text-align: center; min-width: 120px; }
  .act:hover { border-color: var(--accent); }
  .act.on { background: var(--accent); color: #111; border-color: var(--accent); }
  .act small { display: block; font-weight: 400; font-size: 10px; color: var(--dim); margin-top: 2px; }
  .act.on small { color: #333; }
  .waiting { grid-column: 1 / -1; text-align: center; color: var(--dim); font-size: 12px; padding: 14px; }

  /* setup options, playbook builder, sideline */
  .setup-opts { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 14px; font-size: 12px; color: var(--dim); }
  .chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .chk input { width: 16px; height: 16px; accent-color: var(--accent); }
  #pclock { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; background: #000; border: 2px solid var(--line); border-radius: 4px; padding: 2px 8px; min-width: 44px; text-align: center; }
  #pclock.low { border-color: var(--red); color: #ff8d85; }
  #bookScreen h2 { font-size: 18px; letter-spacing: 3px; text-transform: uppercase; margin: 18px 0 6px; text-align: center; }
  #bookScreen p { text-align: center; color: var(--dim); font-size: 13px; margin: 0 0 12px; }
  #bookBar { display: flex; gap: 8px; align-items: center; justify-content: center; margin-bottom: 12px; position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 2; }
  #bookCount { font-size: 14px; font-weight: 700; color: var(--accent); margin-right: 8px; }
  #bookList h3 { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); margin: 16px 0 6px; }
  .book-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  @media (max-width: 640px) { .book-grid { grid-template-columns: repeat(2, 1fr); } }
  .card.sel { border-color: var(--accent); background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--accent); }
  .card .form { font-size: 9px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
  .fronts { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .fronts .lbl { font-size: 11px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
  .fronts .act { padding: 6px 8px; min-width: 90px; }
  #game { position: relative; }
  #sideline { position: absolute; inset: 0; background: rgba(8, 9, 20, 0.92); z-index: 5; display: flex; align-items: flex-start; justify-content: center; padding: 10px; overflow: auto; }
  .sl-box { width: 100%; max-width: 760px; background: var(--panel); border: 3px solid var(--accent); border-radius: 6px; padding: 12px; }
  .sl-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .sl-head strong { font-size: 15px; letter-spacing: 2px; text-transform: uppercase; }
  .sl-tabs { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  .sl-row { display: grid; grid-template-columns: 26px 1fr 44px 110px 64px; gap: 8px; align-items: center; padding: 5px 4px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .sl-row .rk { color: var(--dim); }
  .sl-row.start .rk { color: var(--accent); font-weight: 700; }
  .bar { height: 8px; background: #000; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--good); }
  .bar.mid i { background: var(--accent); }
  .bar.low i { background: var(--red); }
  .sl-row .mv { display: flex; gap: 3px; }
  .sl-row .mv button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 1px 7px; font-size: 12px; }
  .sl-row .mv button:disabled { opacity: 0.3; cursor: default; }
  .sl-groups { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .sl-note { font-size: 11.5px; color: var(--dim); margin: 8px 0; line-height: 1.45; }
  .sl-field { margin: 12px 0; }
  .sl-field .t { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .sl-field .opts { display: flex; gap: 4px; flex-wrap: wrap; }

  /* final */
  #final { text-align: center; }
  #final .result { font-size: 30px; font-weight: 700; margin: 6px 0 14px; font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; margin: 0 auto 14px; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 14px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 400; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
  td:first-child { text-align: left; color: var(--dim); }
  #again { background: var(--accent); color: #111; border: 0; border-radius: 4px; padding: 10px 22px; font-weight: 700; font-size: 14px; letter-spacing: 1px; }
  #log { text-align: left; max-height: 220px; overflow: auto; background: var(--panel); border: 2px solid var(--line); border-radius: 5px; padding: 8px 10px; font-size: 11.5px; line-height: 1.5; margin-top: 14px; color: var(--dim); }
  #log b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<div id="app">
  <button id="title" aria-label="Friday Night Dynasty. Press start.">
    <img id="titleArt" alt="Friday Night Dynasty by Tiny Mana Studios. A coach with a headset and clipboard watches his team huddle under stadium lights at sunset.">
    <span class="hint">CLICK OR PRESS ENTER</span>
    <span class="ver" id="version"></span>
  </button>

  <section id="setup" class="hidden">
    <img id="setupLogo" alt="Friday Night Dynasty">
    <h2>Exhibition</h2>
    <p>Pick the team you will coach. You call every play; your players carry it out.</p>
    <div class="teams" id="teams"></div>
    <div class="setup-opts">
      <button class="seg" id="editBook">Edit playbook</button>
      <span id="bookSummary"></span>
      <label class="chk"><input type="checkbox" id="clockToggle"> 20-second play clock</label>
    </div>
    <div class="note">Milestone 1 build. School names, colours and field art are placeholders.</div>
  </section>

  <section id="game" class="hidden">
    <div id="bug">
      <div class="side" id="s0"><span class="chip"></span><div><div class="ab"></div><div class="to"></div></div><div class="sc">0</div></div>
      <div id="mid"><div class="clk"></div><div class="dd"></div></div>
      <div class="side r" id="s1"><span class="chip"></span><div><div class="ab"></div><div class="to"></div></div><div class="sc">0</div></div>
    </div>
    <div id="stage">
      <div id="phaser"></div>
      <div id="tag" class="hidden">REPLAY</div>
      <div id="calls" class="hidden"></div>
      <div id="banner" class="hidden" role="status" aria-live="polite"></div>
    </div>
    <div id="bar">
      <span class="lbl">Watch</span>
      <button class="seg on" data-speed="1">Normal</button>
      <button class="seg" data-speed="4">Fast</button>
      <button class="seg" data-speed="0">Skip</button>
      <button class="seg" id="mute">Sound on</button>
      <button class="seg" id="sidelineBtn">Sideline <kbd>[S]</kbd></button>
      <span id="prompt"></span>
      <span id="pclock" class="hidden" aria-label="Play clock"></span>
    </div>
    <div id="panel"></div>
    <div id="sideline" class="hidden" role="dialog" aria-label="Sideline">
      <div class="sl-box">
        <div class="sl-head"><strong>Sideline</strong><span class="sl-tabs" id="slTabs"></span><button class="seg" id="slClose">Back to the game</button></div>
        <div id="slBody"></div>
      </div>
    </div>
  </section>

  <section id="bookScreen" class="hidden">
    <h2>Your playbook</h2>
    <p>Pick the eight plays you carry into the game. You need at least one run and one pass.</p>
    <div id="bookBar"><span id="bookCount"></span><button class="seg" id="bookReset">Starter book</button><button class="seg on" id="bookSave">Save and go back</button></div>
    <div id="bookList"></div>
  </section>

  <section id="final" class="hidden">
    <h2>Final</h2>
    <div class="result" id="finalScore"></div>
    <table id="finalTable"></table>
    <button id="again">New game</button>
    <div class="note" id="finalMeta"></div>
    <div id="log"></div>
  </section>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
